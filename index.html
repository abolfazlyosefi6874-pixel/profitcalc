<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ProfitCalc | محاسبه‌گر سود</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    min-height:100vh;
    color:white;
    background:
        radial-gradient(circle at 10% 10%,rgba(124,58,237,.35),transparent 35%),
        radial-gradient(circle at 90% 90%,rgba(6,182,212,.25),transparent 35%),
        #070b14;
    overflow-x:hidden;
}

/* پس زمینه */

body::before{
    content:"";
    position:fixed;
    width:350px;
    height:350px;
    border-radius:50%;
    background:#7c3aed;
    filter:blur(120px);
    opacity:.15;
    top:-150px;
    right:-100px;
    animation:float 7s ease-in-out infinite alternate;
}

body::after{
    content:"";
    position:fixed;
    width:300px;
    height:300px;
    border-radius:50%;
    background:#06b6d4;
    filter:blur(120px);
    opacity:.12;
    bottom:-120px;
    left:-100px;
    animation:float 8s ease-in-out infinite alternate-reverse;
}

/* صفحه */

.container{
    width:min(900px,92%);
    margin:auto;
    padding:35px 0 25px;
    position:relative;
    z-index:1;
}

/* هدر */

.hero{
    text-align:center;
    animation:fadeDown .8s ease;
}

.logo{
    width:70px;
    height:70px;
    margin:auto;
    border-radius:22px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:32px;
    font-weight:bold;

    background:linear-gradient(135deg,#7c3aed,#06b6d4);

    box-shadow:
        0 15px 45px rgba(124,58,237,.35);

    animation:pulse 3s infinite;
}

h1{
    margin-top:18px;
    font-size:38px;
    letter-spacing:-1px;
}

h1 span{
    color:#8b5cf6;
}

.subtitle{
    margin-top:10px;
    color:#94a3b8;
    font-size:14px;
}

/* کارت اصلی */

.card{
    margin-top:30px;
    padding:25px;

    border-radius:28px;

    background:rgba(15,23,42,.72);

    border:1px solid rgba(255,255,255,.09);

    backdrop-filter:blur(20px);

    box-shadow:
        0 30px 80px rgba(0,0,0,.4);

    animation:fadeUp .8s ease;
}

/* ورودی ها */

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.input-box label{
    display:block;
    margin-bottom:8px;
    color:#cbd5e1;
    font-size:13px;
}

.input{
    display:flex;
    align-items:center;

    background:#090f1c;

    border:1px solid #26334b;

    border-radius:15px;

    transition:.3s;

    overflow:hidden;
}

.input:focus-within{
    border-color:#8b5cf6;

    box-shadow:
        0 0 0 3px rgba(139,92,246,.12);

    transform:translateY(-2px);
}

.input input{
    width:100%;
    padding:15px;

    border:0;
    outline:none;

    background:transparent;

    color:white;

    font-size:15px;

    direction:ltr;
}

.unit{
    color:#64748b;
    font-size:11px;
    padding-left:13px;
}

/* دکمه */

.calculate{
    width:100%;

    margin-top:22px;

    padding:17px;

    border:0;

    border-radius:16px;

    color:white;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    background:
        linear-gradient(135deg,#7c3aed,#06b6d4);

    box-shadow:
        0 15px 35px rgba(124,58,237,.25);

    transition:.3s;

    position:relative;
    overflow:hidden;
}

.calculate:hover{
    transform:translateY(-3px);

    box-shadow:
        0 20px 45px rgba(124,58,237,.4);
}

.calculate:active{
    transform:scale(.98);
}

/* خط نور روی دکمه */

.calculate::after{
    content:"";

    position:absolute;

    width:80px;
    height:200%;

    background:rgba(255,255,255,.15);

    transform:rotate(25deg);

    top:-50%;
    left:-120px;

    animation:shine 4s infinite;
}

/* خطا */

#error{
    text-align:center;

    color:#fb7185;

    margin-top:12px;

    min-height:18px;
}

/* نتیجه */

.result{
    display:none;

    margin-top:22px;

    animation:resultShow .5s ease;
}

.result.show{
    display:block;
}

.result-header{
    display:flex;

    justify-content:space-between;

    align-items:center;

    color:#cbd5e1;

    margin-bottom:12px;
}

.check{
    width:32px;
    height:32px;

    border-radius:50%;

    background:#10b981;

    display:flex;
    justify-content:center;
    align-items:center;

    font-weight:bold;
}

/* سود اصلی */

.main-profit{
    text-align:center;

    padding:25px;

    border-radius:22px;

    background:
        linear-gradient(
            135deg,
            rgba(124,58,237,.20),
            rgba(6,182,212,.10)
        );

    border:1px solid rgba(139,92,246,.15);
}

.main-profit small{
    color:#94a3b8;
}

.main-profit strong{
    display:block;

    margin-top:8px;

    font-size:30px;

    color:#a78bfa;
}

/* آمار */

.stats{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:12px;

    margin-top:12px;
}

.stat{
    padding:18px 8px;

    text-align:center;

    border-radius:17px;

    background:rgba(255,255,255,.035);

    border:1px solid rgba(255,255,255,.06);

    transition:.3s;
}

.stat:hover{
    transform:translateY(-4px);

    background:rgba(255,255,255,.06);
}

.stat span{
    display:block;

    color:#94a3b8;

    font-size:11px;

    margin-bottom:8px;
}

.stat strong{
    font-size:13px;
}

/* فوتر */

footer{
    text-align:center;

    margin-top:25px;

    color:#64748b;

    font-size:11px;
}

/* انیمیشن ها */

@keyframes fadeDown{
    from{
        opacity:0;
        transform:translateY(-25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes resultShow{
    from{
        opacity:0;
        transform:scale(.95);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.05);
    }
}

@keyframes float{
    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(40px,30px);
    }
}

@keyframes shine{
    0%{
        left:-120px;
    }

    40%,100%{
        left:120%;
    }
}

/* موبایل */

@media(max-width:650px){

    .container{
        width:94%;
        padding-top:25px;
    }

    h1{
        font-size:30px;
    }

    .card{
        padding:18px;
        border-radius:22px;
    }

    .grid{
        grid-template-columns:1fr;
        gap:14px;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .main-profit strong{
        font-size:24px;
    }

}

</style>
</head>

<body>

<div class="container">

    <header class="hero">

        <div class="logo">₿</div>

        <h1>
            Profit<span>Calc</span>
        </h1>

        <p class="subtitle">
            محاسبه سریع و حرفه‌ای سود فروش
        </p>

    </header>


    <section class="card">

        <div class="grid">

            <div class="input-box">

                <label>
                    قیمت خرید هر کالا
                </label>

                <div class="input">

                    <input
                        type="number"
                        id="buyPrice"
                        placeholder="مثلاً 500000"
                    >

                    <span class="unit">
                        تومان
                    </span>

                </div>

            </div>


            <div class="input-box">

                <label>
                    قیمت فروش هر کالا
                </label>

                <div class="input">

                    <input
                        type="number"
                        id="sellPrice"
                        placeholder="مثلاً 750000"
                    >

                    <span class="unit">
                        تومان
                    </span>

                </div>

            </div>


            <div class="input-box">

                <label>
                    هزینه جانبی هر کالا
                </label>

                <div class="input">

                    <input
                        type="number"
                        id="extraCost"
                        placeholder="مثلاً 30000"
                    >

                    <span class="unit">
                        تومان
                    </span>

                </div>

            </div>


            <div class="input-box">

                <label>
                    تعداد کالا
                </label>

                <div class="input">

                    <input
                        type="number"
                        id="quantity"
                        placeholder="مثلاً 10"
                    >

                    <span class="unit">
                        عدد
                    </span>

                </div>

            </div>

        </div>


        <button
            class="calculate"
            onclick="calculateProfit()"
        >
            محاسبه سود
            ←
        </button>


        <div id="error"></div>


        <section
            id="result"
            class="result"
        >

            <div class="result-header">

                <span>
                    نتیجه محاسبه
                </span>

                <span class="check">
                    ✓
                </span>

            </div>


            <div class="main-profit">

                <small>
                    سود کل شما
                </small>

                <strong id="totalProfit">
                    0 تومان
                </strong>

            </div>


            <div class="stats">

                <div class="stat">

                    <span>
                        سود هر کالا
                    </span>

                    <strong id="unitProfit">
                        0
                    </strong>

                </div>


                <div class="stat">

                    <span>
                        درصد سود
                    </span>

                    <strong id="profitPercent">
                        0%
                    </strong>

                </div>


                <div class="stat">

                    <span>
                        درآمد کل
                    </span>

                    <strong id="totalRevenue">
                        0
                    </strong>

                </div>


                <div class="stat">

                    <span>
                        هزینه کل
                    </span>

                    <strong id="totalCost">
                        0
                    </strong>

                </div>

            </div>

        </section>

    </section>


    <footer>
        ساخته شده با ❤️ | ProfitCalc
    </footer>

</div>


<script>

function formatNumber(number){

    return new Intl.NumberFormat("fa-IR").format(
        Math.round(number)
    );

}


function calculateProfit(){

    const buyPrice =
        Number(
            document.getElementById("buyPrice").value
        );

    const sellPrice =
        Number(
            document.getElementById("sellPrice").value
        );

    const extraCost =
        Number(
            document.getElementById("extraCost").value
        );

    const quantity =
        Number(
            document.getElementById("quantity").value
        );


    const error =
        document.getElementById("error");

    const result =
        document.getElementById("result");


    error.textContent = "";

    result.classList.remove("show");


    if(
        buyPrice <= 0 ||
        sellPrice <= 0 ||
        quantity <= 0 ||
        extraCost < 0
    ){

        error.textContent =
            "لطفاً همه اطلاعات را صحیح وارد کنید.";

        return;

    }


    const costPerUnit =
        buyPrice + extraCost;


    const profitPerUnit =
        sellPrice - costPerUnit;


    const totalProfit =
        profitPerUnit * quantity;


    const totalRevenue =
        sellPrice * quantity;


    const totalCost =
        costPerUnit * quantity;


    const profitPercent =
        (profitPerUnit / costPerUnit) * 100;


    document.getElementById(
        "totalProfit"
    ).textContent =
        formatNumber(totalProfit)
        + " تومان";


    document.getElementById(
        "unitProfit"
    ).textContent =
        formatNumber(profitPerUnit)
        + " تومان";


    document.getElementById(
        "profitPercent"
    ).textContent =
        profitPercent.toFixed(1)
        + "%";


    document.getElementById(
        "totalRevenue"
    ).textContent =
        formatNumber(totalRevenue);


    document.getElementById(
        "totalCost"
    ).textContent =
        formatNumber(totalCost);


    result.classList.add("show");

}

</script>

</body>
</html>
